name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # The plugin itself compiles against the game's assemblies, so CI runs only the game-free tests.
      - name: Run tests
        run: dotnet run --project tests/BaanishUiImprovements.Tests -c Release
