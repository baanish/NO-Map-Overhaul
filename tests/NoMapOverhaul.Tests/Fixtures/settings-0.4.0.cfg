## Settings file was created by plugin Baanish UI Improvements v0.4.0
## Plugin GUID: com.baanish.nuclearoption.uiimprovements

[Airbase Boundary]

## Shade each friendly airbase's landing zone: stop inside it after landing and the sortie ends as returned instead of crashed. The same circle is the capture zone. Uses the game's friendly map colour.
# Setting type: Boolean
# Default value: false
ShowBoundary = true

## Opacity of the shaded zone. The game blends in linear colour space, so small values already read strongly over the dark map.
# Setting type: Single
# Default value: 0.01
# Acceptable value range: From 0 to 1
FillOpacity = 0.009577462

## Opacity of the zone's edge line. 0 hides it.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 1
EdgeOpacity = 0.09953053

[Airbase Names]

## Name your faction's airbases just under them on the full map.
# Setting type: Boolean
# Default value: false
ShowNames = true

## Also name enemy and neutral airbases. Off by default, since the names show where bases are that the game doesn't mark.
# Setting type: Boolean
# Default value: false
ShowEnemyAndNeutral = false

## Colour of the airbase names, a fainter version of the runway numbers' green by default. Much lower alpha loses the green text over the map's green linework.
# Setting type: Color
# Default value: 99FF99BF
Color = 99FF99BF

## Airbase name size on the map.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 4 to 64
Size = 8

[Approach]

## Show the approach line and HUD callout for the nearest runway within this distance.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.5 to 30
TriggerRangeKm = 5

## Length of the dashed centerline drawn off the nearest runway end. Each dash plus gap is 500 m.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.5 to 30
LineLengthKm = 5

## Colour of the dashed approach line on the map. Keep it fainter than the runway so the two read apart.
# Setting type: Color
# Default value: 00D90066
LineColor = 00D90066

## Approach line width, in map icon units.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 10
LineWidth = 1

[General]

## Off hides everything this mod draws, as if it were not installed. Useful for checking whether a problem comes from the mod or the game.
# Setting type: Boolean
# Default value: true
Enabled = true

## Every 5 seconds, log the game's frame rate and the mod's own time per frame and per map refresh to BepInEx/LogOutput.log. Flip Enabled while it's on to compare with and without the mod.
# Setting type: Boolean
# Default value: false
LogPerformance = false

## In a mission, in an aircraft: measures the frame rate with the mod off, on, and on with a heavy set of drawings, on the minimap and the full map, then puts everything back. About 75 seconds; press again to cancel. Results go to the screen and BepInEx/LogOutput.log.
# Setting type: Boolean
# Default value: false
PerfTest = false

[HUD]

## Label the nearest runway end in the 3D view, for ATC calls.
# Setting type: Boolean
# Default value: true
ShowRunwayCallout = true

## Show the callout only while the landing gear is down.
# Setting type: Boolean
# Default value: false
OnlyWithGearDown = false

## Prefix the callout with the abbreviated airbase name, e.g. NBSCLI RWY 27.
# Setting type: Boolean
# Default value: false
IncludeAirbaseName = true

## Colour of the HUD runway callout.
# Setting type: Color
# Default value: 33FF33FF
CalloutColor = 33FF33FF

[Map]

## Draw friendly runways and their numbers on the minimap and full map.
# Setting type: Boolean
# Default value: true
ShowRunways = true

## Fill colour of runway strips.
# Setting type: Color
# Default value: 00D900D9
RunwayColor = 00D900D9

## Colour of the runway numbers on the map.
# Setting type: Color
# Default value: 99FF99FF
RunwayLabelColor = 99FF99FF

## Number both ends of every runway. Off hides the number at the end of a one-way runway that the game never lands you from.
# Setting type: Boolean
# Default value: true
NumberBothEnds = true

## Runway number size on the map.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 4 to 64
RunwayLabelSize = 8

## Dark rim around runways, approach dashes, and map text so they stay readable over bright map linework.
# Setting type: Color
# Default value: 051405D9
OutlineColor = 051405D9

## Rim width around runways and approach dashes, in map icon units. 0 turns it off.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0 to 6
OutlineWidth = 1

## Minimum drawn runway width when zoomed out, in map icon units.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 30
RunwayMinWidth = 6

[Map Tools]

## Show the Tools button on the full map and everything drawn with it. Off hides both; drawings come back when it's on again, until you leave the mission.
# Setting type: Boolean
# Default value: true
ShowTools = true

## Show drawings on the minimap as well as the full map. Off keeps the minimap clear; the full map and the 3D labels still show them.
# Setting type: Boolean
# Default value: true
ShowOnMinimap = true

## Draw each circle in the 3D view as well, as a thin ring level with its centre: a unit's altitude, or the ground under a fixed point.
# Setting type: Boolean
# Default value: true
ShowCirclesIn3D = true

## Colour of new lines, arrows, and text. The menu's swatches set it; any colour works here.
# Setting type: Color
# Default value: 33FF33FF
Color = 33FF33FF

## Width of drawn lines, in map icon units.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0.5 to 8
LineWidth = 1.5

## Size of text the tools draw on the map.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 4 to 64
TextSize = 10

## Units for distances the tools show. Game follows the game's own setting: kilometres for metric, nautical miles for imperial.
# Setting type: UnitsSetting
# Default value: Game
# Acceptable values: Game, NauticalMiles, Kilometres, StatuteMiles
DistanceUnits = Game

## Most drawings kept at once. Tools can't add more until something is erased or undone.
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 10 to 1000
MaxShapes = 200

## Most freehand points kept across all pen strokes, so the map stays fast.
# Setting type: Int32
# Default value: 5000
# Acceptable value range: From 500 to 7500
MaxPenPoints = 5000

## Undo the last drawing change while the full map is open. Z isn't bound in the game's default controls.
# Setting type: KeyboardShortcut
# Default value: Z
UndoKey = Z

## Redo while the full map is open. Y isn't bound in the game's default controls.
# Setting type: KeyboardShortcut
# Default value: Y
RedoKey = Y

## A waypoint counts as reached once you fly within this distance of it, and the route moves on to the next. NOAutopilot's default.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 0.1 to 20
WaypointReachKm = 2.5

## A waypoint behind you also counts as reached while it's within this distance, so a wide miss still moves the route on. NOAutopilot's default. 0 turns it off.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 50
WaypointPassedKm = 10

[Missile Arrows]

## Point an arrow from the screen edge at each incoming missile outside the view. Only missiles the game's missile warning already knows about get one.
# Setting type: Boolean
# Default value: true
ShowArrows = true

## Colour of the missile arrows.
# Setting type: Color
# Default value: FF4033FF
Color = FF4033FF

